name: Refresh avatar and profile
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    paths:
      - 'scripts/render.py'
      - '.github/workflows/update-profile.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install 'Pillow>=10,<13'
      - name: Regenerate ASCII portrait and live counters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: moosacodes
        run: python scripts/render.py
      - name: Commit only when artwork changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dark.svg assets/light.svg assets/portrait.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync current GitHub avatar and profile stats'
            git push
          fi
