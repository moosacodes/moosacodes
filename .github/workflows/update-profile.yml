name: Render profile terminal
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/terminal.py'
      - '.github/workflows/update-profile.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python scripts/terminal.py
      - name: Commit regenerated terminal GIF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/terminal.gif
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate profile terminal'
            git push
          fi
