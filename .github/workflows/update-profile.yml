name: Update terminal profile
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install terminal renderer
        run: python -m pip install git+https://github.com/x0rzavi/github-readme-terminal.git@main
      - name: Generate terminal profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIFOS_GENERAL_FPS: 13
          GIFOS_GENERAL_LOOP_COUNT: 4
          GIFOS_GENERAL_COLOR_SCHEME: everblush
        run: python main.py
      - name: Commit regenerated profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md output.gif
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update terminal profile'
            git push
          fi
